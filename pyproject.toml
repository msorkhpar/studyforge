# studyforge — packaging, test runner, and lint configuration.
#
# ⛔ `dependencies` is empty and stays empty. Standard library only in framework
# source (R11's neighbour in `docs/conventions/module-structure.md`, and the
# reason R15 exempts the serving process from containerisation: a process with
# no dependencies gains no reproducibility from an image). A runtime dependency
# added here is a design change, not a convenience — `tests/test_repository.py`
# fails the build if this list grows.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyforge"
version = "0.1.0"
description = "Turns any body of teaching material into a local, offline study site."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# Test-only and tooling-only. Never imported by anything under `src/`.
[project.optional-dependencies]
test = ["pytest>=8.0"]
lint = ["ruff>=0.6"]

# ⛔ The installed command, and SF-40 is this table's ONLY minter: nothing else
# in the tree registers a verb. The verbs are `studyforge.cli.dispatch.VERBS`,
# reached from here rather than listed anywhere a second time.
#
# ⚠️ One script name, not one per verb. `studyforge-build` and its siblings
# would put the subcommand structure in two places — here and in the dispatcher
# — and the two would drift. `tests/test_authoring_reference.py` reads this
# table, resolves the target and asks it for its verbs, so a document cannot
# offer a fenced `studyforge <verb>` the tree does not install.
[project.scripts]
studyforge = "studyforge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

# ⛔ `src` only. This is what keeps `tools/` — the quality floor — out of the
# distribution: it is developer tooling, not shipped API, and an installed
# `studyforge` must contain no `tools` package.
[tool.setuptools.packages.find]
where = ["src"]

# R13: templates and assets are source files, shipped with the package.
# Declared here so SF-11/SF-12 add files rather than build configuration.
[tool.setuptools.package-data]
studyforge = ["**/templates/*.html", "**/assets/*"]

[tool.pytest.ini_options]
minversion = "8.0"
# Two roots, by ruling: the framework's tests mirror `src/` into `tests/`, and
# the quality tooling's tests sit beside the tooling at `tools/tests/`.
testpaths = ["tests", "tools/tests"]
# `src` puts the package on the path without an install step, so the suite runs
# from a clean checkout with no network. `.` makes `tests.support` and
# `tools.quality` importable the way CodeSignal's suite imports `tests.support`.
pythonpath = ["src", "."]
# ⚠️ `importlib` is not decoration. R12's mirror puts a `test_init.py` in every
# package directory, and under pytest's default `prepend` import mode two files
# with the same basename in directories that are not packages collide on the
# module name — the suite fails to collect before it runs a single test. The
# alternatives were an `__init__.py` in every test directory, or renaming the
# mirrors so they no longer mirror. This is the one that leaves R12 intact.
addopts = "--strict-markers --strict-config --import-mode=importlib"
consider_namespace_packages = true

# ---------------------------------------------------------------------------
# Lint and format — ruff, optional and absent here.
#
# ⚠️ Ruff is NOT installed in this environment and no network install is
# assumed. ⛔ The lint clause of FND-01's acceptance is therefore **blocked on
# FND-03**, which builds the image ruff is installed into; it is not claimed as
# passing. Ruff is configured here, declared as the `lint` extra above, and
# skipped with an explicit message when missing — see `tests/test_repository.py`.
# On the host the floor degrades to the standard-library size and style check,
# which always runs.
# The rules this project actually cares about (R11 size, R12 mirroring, R17
# contracts) are enforced by `tools/quality/`, which is standard library only
# and therefore always runs. Ruff covers the ordinary style layer on top,
# wherever it happens to be available (FND-03's image is the obvious place).
#
# ⛔ `line-length` here and `tools.quality.config.LINE_LENGTH` must agree, or
# the always-on checker and the optional one disagree about the same file.
# `tools/tests/quality/test_config.py` asserts they do.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tools", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# D203/D213 conflict with D211/D212; the docstring shape this project wants is
# a summary line on the opening quotes, no blank line before the class body.
ignore = ["D203", "D213"]

# ⚠️ This block is FND-03's, and it exists because FND-01 chose this ruleset
# without ever being able to run it — ruff was not installed and no network
# install could be assumed, so the lint clause was recorded Blocked. The image
# is where it first ran, and the first run reported 126 findings of which 95
# were D103 on test functions. That is not 95 defects; it is one wrong rule
# selection, and this is where it is corrected.
[tool.ruff.lint.per-file-ignores]
# ⛔ Docstring rules do not apply to test modules, and this defers to a ruling
# this repository already made rather than inventing one: the project's own
# contract check exempts them, in `tools/quality/docstrings.py`, because "a
# test module's name and its assertions say what it covers. Demanding a
# contract from it would be demanding a second description of the same thing,
# which is a description that goes stale."
#
# ⚠️ Scoped to the two test trees by name, never turned off globally. D103 on
# a public function in `src/` or `tools/quality/` is a real R17 failure and
# still fails the build.
"tests/**/*.py" = ["D"]
"tools/tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
# ⛔ All three of this repository's import roots are first-party, and saying so
# is not cosmetic. Left to inference, ruff reads `studyforge` as first-party
# (it finds `src/studyforge`) and `tests` as third-party, and then sorts a
# module's own package BELOW the test helper it imports — a diff that reverses
# the reading order of every mirrored test for no reason a reader could name.
known-first-party = ["studyforge", "tests", "tools"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true

# ⛔ There is no `exclude` here, and there is not meant to be one. FND-03 added
# a one-file exclusion because formatting `tests/test_fixture_consistency.py`
# took it over R11's 600-line test ceiling, and recorded it as an interim with
# three ways out. FND-04's follow-up took the one the CTO ruled for: the module
# is split along the five seams its checks already had, into
# `tests/fixture_checks/`, and every file is formatted and well under the
# ceiling. ⚠️ The assertion that kept the list to one entry is gone with it —
# a guard that outlives what it guarded is how a list becomes the place
# difficult files go.
