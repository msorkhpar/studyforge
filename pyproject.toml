# studyforge — packaging, test runner, and lint configuration.
#
# ⛔ `dependencies` is empty and stays empty. Standard library only in framework
# source (the spec's §3.2, and the
# reason R15 exempts the serving process from containerisation: a process with
# no dependencies gains no reproducibility from an image). A runtime dependency
# added here is a design change, not a convenience — `tests/test_repository.py`
# fails the build if this list grows.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyforge"
version = "0.1.0"
description = "Turns any body of teaching material into a local, offline study site."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# Test-only and tooling-only. Never imported by anything under `src/`.
[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-xdist>=3.8"]
lint = ["ruff>=0.6"]

# ⛔ The installed command, and this table is its ONLY registration: nothing
# else in the tree registers a verb. The verbs are `studyforge.cli.dispatch.VERBS`,
# reached from here rather than listed anywhere a second time.
#
# ⚠️ One script name, not one per verb. `studyforge-build` and its siblings
# would put the subcommand structure in two places — here and in the dispatcher
# — and the two would drift. `tests/test_authoring_reference.py` reads this
# table, resolves the target and asks it for its verbs, so a document cannot
# offer a fenced `studyforge <verb>` the tree does not install.
[project.scripts]
studyforge = "studyforge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

# ⛔ `src` only. This is what keeps the test suite and its product floor
# (`tests/floor/`) out of the distribution: they are developer tooling, not
# shipped API, and an installed `studyforge` must contain no `tools` package.
[tool.setuptools.packages.find]
where = ["src"]

# Templates and assets are source files, shipped with the package, so a new
# template or asset is a file added rather than a build configuration changed.
#
# ⛔ Every skill's procedure ships too: the skill documents are the product
# (R16, R19). A glob, never a list, so a new skill ships by existing.
# `studyforge.skills.documents` is how an installed package reads them, and
# `tests/studyforge/skills/test_documents.py` builds a wheel and fails on any
# tree `SKILL.md` missing from it.
[tool.setuptools.package-data]
studyforge = [
    "**/templates/*.html",
    "**/assets/*",
    "skills/**/SKILL.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
# One root: the framework's tests mirror `src/` into `tests/`.
testpaths = ["tests"]
# `src` puts the package on the path without an install step, so the suite runs
# from a clean checkout with no network. `.` makes the test tree's own helpers,
# such as `tests.support`, importable as a package.
pythonpath = ["src", "."]
# ⚠️ `importlib` is not decoration. R12's mirror puts a `test_init.py` in every
# package directory, and under pytest's default `prepend` import mode two files
# with the same basename in directories that are not packages collide on the
# module name — the suite fails to collect before it runs a single test. The
# alternatives were an `__init__.py` in every test directory, or renaming the
# mirrors so they no longer mirror. This is the one that leaves R12 intact.
addopts = "--strict-markers --strict-config --import-mode=importlib"
consider_namespace_packages = true

# ---------------------------------------------------------------------------
# Lint and format — ruff, optional and absent here.
#
# ⚠️ Ruff may be absent on a host, and no network install is assumed. It is
# configured here, declared as the `lint` extra above, installed in the
# development image (`docker/dev/`), and skipped with an explicit message when
# missing — see `tests/test_repository.py`.
# The rules this project cares about most (the size ceiling, the mirrored
# tests, the module contracts) are enforced by the product floor,
# `python3 -m tests.floor`, which is standard library only and therefore always
# runs. Ruff covers the ordinary style layer on top.
#
# ⛔ `line-length` here and `tests.floor.config.LINE_LENGTH` must agree, or
# the always-on checker and the optional one disagree about the same file.
# `tests/floor/test_config.py` asserts they do.
#
# ⛔ `target-version` is DECLARED, never inferred. Absent, ruff infers it from
# `requires-python`, an input to the byte-for-byte reproducibility claim that
# nothing names. ⭐ `py314` is `requires-python`'s floor and the image's pinned
# Python. ⚠️ It is the one declaration: top-level, so the formatter AND the
# linter read it, and it keeps PEP 758's bare `except A, B:` wherever no name is
# bound. An older target would describe a Python this project does not run on.
# `tests/test_repository.py` asserts it exists, follows `requires-python`, and is
# what ruff resolves in every formatted directory.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# D203/D213 conflict with D211/D212; the docstring shape this project wants is
# a summary line on the opening quotes, no blank line before the class body.
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# ⛔ Docstring rules do not apply to test modules, and this defers to a ruling
# this repository already made rather than inventing one: the project's own
# contract check exempts them, in `tests/floor/docstrings.py`, because "a
# test module's name and its assertions say what it covers. Demanding a
# contract from it would be demanding a second description of the same thing,
# which is a description that goes stale."
#
# ⚠️ Scoped to the test tree by name, never turned off globally. D103 on
# a public function in `src/` is a real R17 failure and still fails the build.
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
# ⛔ Both of this repository's import roots are first-party, and saying so
# is not cosmetic. Left to inference, ruff reads `studyforge` as first-party
# (it finds `src/studyforge`) and `tests` as third-party, and then sorts a
# module's own package BELOW the test helper it imports — a diff that reverses
# the reading order of every mirrored test for no reason a reader could name.
known-first-party = ["studyforge", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true

# ⛔ There is no `exclude` here, and there is not meant to be one: every file is
# formatted. A module that formatting would take over the size ceiling is split
# along its seams instead, because an exclusion list becomes the place
# difficult files go.
