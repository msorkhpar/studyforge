<section data-practice-quiz="${key}" data-corpus="${corpus}" aria-label="Questions" tabindex="-1">
<div data-practice-part="head"><h2>Answer these</h2></div>
${grader}<ol data-practice-part="questions">
${questions}</ol>
<p data-practice-part="controls"><button type="button" data-practice-part="check">Check answers</button></p>
<p data-practice-part="status" role="status" aria-live="polite" data-practice-right="{right} of {asked} answered correctly." data-practice-complete="Every question answered correctly." data-practice-blank="Choose an answer first."></p>
</section>
