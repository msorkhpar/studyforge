<section data-practice-quiz="${key}" data-corpus="${corpus}" aria-label="Questions" tabindex="-1">
<div data-practice-part="head"><h2>Answer these</h2></div>
${grader}<ol data-practice-part="questions">
${questions}</ol>
<p data-practice-part="offline">Checking answers needs the local study server. This page was opened as a file, so read the questions and choose your answers; nothing here can check them.</p>
<p data-practice-part="controls" hidden><button type="button" data-practice-part="check">Check answers</button></p>
<p data-practice-part="status" role="status" aria-live="polite" data-practice-right="{right} of {asked} answered correctly." data-practice-complete="Every question answered correctly." data-practice-blank="Choose an answer first." data-practice-checking="Checking…" data-practice-failed="The local study server did not check these answers. Try again."></p>
</section>
