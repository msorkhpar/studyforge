# The framework's build environment, as a service.
#
#     docker/dev/check                      the whole suite, in the container
#     docker/dev/check python3 -m tests.floor        anything else, in it
#
# ⛔ **There is no direct form that is not `check`'s own.** What `check` runs is
# below: with the attestation variable, or this build re-exports moving
# provenance digests (the reason is in `check`'s own block), and with the
# identity `check` DERIVES from the build inputs, or `image:` refuses to
# resolve. ⚠️ A hand-typed identity is a name, not a derivation:
#
#     STUDYFORGE_DEV_IDENTITY=<derived by check> BUILDX_NO_DEFAULT_ATTESTATIONS=1 \
#         docker compose -f docker/dev/compose.yaml run --rm --build dev
#
# ⚠️ **The declarative form would belong in THIS file and is INERT here.**
# `build: provenance: false` does not stop this Compose and buildx exporting a
# moving attestation, through `run --build`, through plain `build`, or through
# `COMPOSE_BAKE=true`; a `.env` beside this file does not carry the variable
# either. ⛔ So the key is NOT shipped — a decoration that reads like the fix is
# worse than none — and the wrapper is the only site that works.
# ⭐ `tests/docker/test_dev_provenance.py` asserts both halves: that this header
# carries the variable, and that the inert key is absent from the YAML.
#
# ⭐ The command inside is the same command a contributor runs on the host:
# `python3 -m pytest`. That is the point of the image rather than a detail of
# it — a build environment whose invocation differs from the host's teaches
# people two things instead of one, and hides the divergence it was built to
# eliminate.
#
# ⛔ No Docker socket is mounted, here or anywhere. Not behind a flag, not
# "only locally": a process holding the socket holds the host.
#
# ⛔ No port is published and no network is joined. This image builds and
# tests; it serves nothing. `studyforge serve` is a host process and has no
# service here.

name: studyforge-dev

services:
  dev:
    build:
      # Relative to this file, so the same command works from any directory
      # and no absolute path is written down.
      context: .
      dockerfile: Dockerfile
      # ⭐ The checkout as a NAMED context, for the Dockerfile's install
      # step to bind-mount `pyproject.toml` and `README.md` from. BuildKit
      # transfers only the paths a step names, so nothing else crosses.
      additional_contexts:
        project: ../..
    # ⛔ **Named by its build inputs' CONTENT, never by one shared tag.**
    # `check` derives the identity and exports it; unset, this file refuses to
    # start rather than fall back to a name two checkouts would share.
    image: "studyforge/dev:inputs-${STUDYFORGE_DEV_IDENTITY:?docker/dev/check derives this from the build inputs; run that}"

    # ⛔ Enforced rather than asserted: **no network access is required to run
    # tests**. `none` means the container has no
    # interface at all, so a test that quietly reached for a package index or
    # an API would fail here rather than pass on the machine that had one.
    #
    # ⚠️ This is the run half of the tension. The build half — `pip install` in
    # the Dockerfile — does need the network, and gets it, because a build and
    # a test run are different moments. Everything the tests need is already in
    # the image by the time this applies.
    network_mode: "none"

    # The checkout, mounted where the image expects it. `../..` is this file's
    # own repository root, resolved by Compose relative to the file.
    volumes:
      - ../..:/workspace
    working_dir: /workspace

    # ⛔ Never root, and never a uid written into a file. `check` derives the
    # invoking user's uid and gid at run time and passes them in; without that
    # the container writes into the bind mount as root and leaves a
    # contributor with files they cannot delete.
    # ⚠️ The default is the base image's `nobody`, chosen so that forgetting to
    # set it degrades to "cannot write" rather than to "writes as root".
    user: "${STUDYFORGE_UID:-65534}:${STUDYFORGE_GID:-65534}"

    # ⛔ **Shared memory, sized for a full-page capture.** Docker's default
    # `/dev/shm` is 64 MB. The browser transfers a `Page.captureScreenshot`
    # result through shared memory, and `tests/visual/page.py` asks for
    # `captureBeyondViewport`, a full-page capture. At 64 MB the browser's GPU
    # process dies and respawns in a loop, and a capture never returns: the
    # suite hangs rather than failing.
    #
    # ⭐ Fixed HERE rather than by adding `--disable-dev-shm-usage` to the
    # harness's launch flags, because the size of `/dev/shm` is a fact about how
    # this image is RUN, which this file owns. A flag that routes the browser's
    # shared memory onto disk instead would change what every reading is taken
    # against.
    shm_size: "1gb"

    # ⭐ **The visual harness's three variables, passed through.**
    # ⛔ Without this the container cannot be told to demand a browser, to name
    # one, or to keep its captures: the values stop at the host, and a reviewer
    # who ran `STUDYFORGE_VISUAL=required docker/dev/check` would get a run
    # whose demand was silently unset.
    #
    # ⭐ **Pass-through, and deliberately NOT a default.** The bare-name form
    # takes the host's value and leaves the variable *unset* in here when the
    # host has none, so this file decides nothing about what a run demands — it
    # only stops the caller's answer being dropped at the boundary. ⛔ A default
    # of `required` here would set the demand for every run of the image, which
    # changes what every reading is taken against. ⭐ What keeps the browser
    # honest instead is `tests/docker/test_dev_image_browser.py`, which asserts
    # from **inside** this image that one arrived.
    #
    # ⚠️ `STUDYFORGE_VISUAL_CAPTURES` is a path INSIDE the container. A host
    # path only resolves if it is under the bind mount, and nothing is written
    # into the checkout by default — `conftest.py` uses pytest's temporary
    # directory when it is unset, because a capture's path could be a home
    # directory, which is personal data.
    environment:
      - STUDYFORGE_VISUAL
      - STUDYFORGE_VISUAL_BROWSER
      - STUDYFORGE_VISUAL_CAPTURES

    init: true
